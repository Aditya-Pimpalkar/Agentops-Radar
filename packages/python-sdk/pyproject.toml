[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentops-radar"
version = "0.1.0"
description = "Python SDK for AgentOps Radar — AI agent observability and evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["agentops_radar"]
