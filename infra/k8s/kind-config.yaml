# kind cluster configuration for local AgentOps Radar development.
# Creates a 1-control-plane + 2-worker cluster with port mappings for
# ingress access on localhost.
#
# Usage:
#   kind create cluster --name radar --config infra/k8s/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: radar
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30080       # NodePort for HTTP direct access
        hostPort: 30080
        protocol: TCP
  - role: worker
  - role: worker
