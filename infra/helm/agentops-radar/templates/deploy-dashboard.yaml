apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentops-radar.fullname" . }}-dashboard
  labels:
    {{- include "agentops-radar.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentops-radar.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "agentops-radar.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.port }}
          env:
            - name: INTERNAL_API_URL
              value: "http://{{ include "agentops-radar.fullname" . }}-api:{{ .Values.api.port }}"
            - name: NEXT_PUBLIC_API_URL
              value: ""   # set via ingress host in production
            - name: NEXT_PUBLIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentops-radar.fullname" . }}-secrets
                  key: apiKey
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentops-radar.fullname" . }}-dashboard
  labels:
    {{- include "agentops-radar.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "agentops-radar.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: {{ .Values.dashboard.port }}
      targetPort: http
