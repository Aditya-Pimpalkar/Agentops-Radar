{{/* ── store consumer ──────────────────────────────────────────────────── */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentops-radar.fullname" . }}-consumer-store
  labels:
    {{- include "agentops-radar.labels" . | nindent 4 }}
    app.kubernetes.io/component: consumer-store
spec:
  replicas: {{ .Values.consumers.store.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentops-radar.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: consumer-store
  template:
    metadata:
      labels:
        {{- include "agentops-radar.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: consumer-store
    spec:
      containers:
        - name: consumer-store
          image: "{{ .Values.consumers.store.image.repository }}:{{ .Values.consumers.store.image.tag }}"
          command: ["python", "-m", "consumers.store_consumer"]
          envFrom:
            - configMapRef:
                name: {{ include "agentops-radar.fullname" . }}-config
          env:
            - name: DATABASE_URL
              value: "postgresql://radar:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgresql:5432/agentops_radar"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentops-radar.fullname" . }}-secrets
                  key: postgresPassword
            - name: KAFKA_GROUP_ID
              value: "radar-store"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
