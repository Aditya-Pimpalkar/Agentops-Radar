apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentops-radar.fullname" . }}-api
  labels:
    {{- include "agentops-radar.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentops-radar.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "agentops-radar.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
          envFrom:
            - configMapRef:
                name: {{ include "agentops-radar.fullname" . }}-config
          env:
            - name: DATABASE_URL
              value: "postgresql://radar:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgresql:5432/agentops_radar"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentops-radar.fullname" . }}-secrets
                  key: postgresPassword
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentops-radar.fullname" . }}-secrets
                  key: apiKey
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentops-radar.fullname" . }}-secrets
                  key: secretKey
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentops-radar.fullname" . }}-secrets
                  key: openaiApiKey
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentops-radar.fullname" . }}-api
  labels:
    {{- include "agentops-radar.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "agentops-radar.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
---
{{- if .Values.api.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agentops-radar.fullname" . }}-api
  labels:
    {{- include "agentops-radar.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "agentops-radar.fullname" . }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
