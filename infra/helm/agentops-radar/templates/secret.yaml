apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentops-radar.fullname" . }}-secrets
  labels:
    {{- include "agentops-radar.labels" . | nindent 4 }}
type: Opaque
stringData:
  apiKey: {{ .Values.secrets.apiKey | quote }}
  secretKey: {{ .Values.secrets.secretKey | quote }}
  openaiApiKey: {{ .Values.secrets.openaiApiKey | quote }}
  postgresPassword: {{ .Values.secrets.postgresPassword | quote }}
