{{- if .Values.ingestion.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentops-radar.fullname" . }}-ingestion
  labels:
    {{- include "agentops-radar.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion
spec:
  replicas: {{ .Values.ingestion.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentops-radar.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ingestion
  template:
    metadata:
      labels:
        {{- include "agentops-radar.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ingestion
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "{{ .Values.ingestion.ports.http }}"
    spec:
      containers:
        - name: ingestion
          image: "{{ .Values.ingestion.image.repository }}:{{ .Values.ingestion.image.tag }}"
          imagePullPolicy: {{ .Values.ingestion.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ingestion.ports.http }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.ingestion.ports.grpc }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "agentops-radar.fullname" . }}-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentops-radar.fullname" . }}-secrets
                  key: apiKey
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ingestion.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentops-radar.fullname" . }}-ingestion
  labels:
    {{- include "agentops-radar.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion
spec:
  selector:
    {{- include "agentops-radar.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion
  ports:
    - name: http
      port: {{ .Values.ingestion.ports.http }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.ingestion.ports.grpc }}
      targetPort: grpc
      protocol: TCP
{{- end }}
